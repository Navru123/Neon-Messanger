name: Check Messenger

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: Smoke test server health endpoint
        run: |
          npm start > /tmp/neon-messenger.log 2>&1 &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/neon-messenger.log
          exit 1

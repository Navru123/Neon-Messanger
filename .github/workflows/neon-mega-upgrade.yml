name: NEON mega upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply NEON mega upgrade') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NEON
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, marker, fn):
              p = Path(path)
              s = p.read_text()
              if marker in s:
                  print(f'{path}: already patched')
                  return False
              s = fn(s)
              p.write_text(s)
              return True

          def server(s):
              table = '''\n  CREATE TABLE IF NOT EXISTS broadcasts (\n    id TEXT PRIMARY KEY, title TEXT NOT NULL, message TEXT NOT NULL, style TEXT NOT NULL DEFAULT 'spotlight',\n    duration_ms INTEGER NOT NULL DEFAULT 9000, created_by TEXT NOT NULL REFERENCES users(id), created_at INTEGER NOT NULL\n  );\n'''
              anchor = '  CREATE TABLE IF NOT EXISTS events ('
              if 'CREATE TABLE IF NOT EXISTS broadcasts' not in s:
                  pos = s.index(anchor)
                  s = s[:pos] + table + s[pos:]
              route = r'''\n\n// Admin live broadcast: an explicit, visible community announcement shown to every connected user.\napp.post("/api/admin/broadcasts", requireAuth, requireAdmin, (req, res) => {\n  const title = clean(req.body?.title, 60) || "NEON LIVE";\n  const message = clean(req.body?.message, 280);\n  const style = ["spotlight", "celebrate", "alert"].includes(req.body?.style) ? req.body.style : "spotlight";\n  const durationMs = Math.max(4000, Math.min(20000, Number(req.body?.durationMs) || 9000));\n  if (message.length < 1) return res.status(400).json({ error: "Schreibe eine Nachricht für das Live-Event." });\n  const payload = { id: id(), title, message, style, durationMs, sender: req.user.displayName || req.user.username, createdAt: Date.now() };\n  db.prepare("INSERT INTO broadcasts(id,title,message,style,duration_ms,created_by,created_at) VALUES(?,?,?,?,?,?,?)")\n    .run(payload.id, payload.title, payload.message, payload.style, payload.durationMs, req.user.id, payload.createdAt);\n  io.emit("global-spotlight", payload);\n  res.json({ broadcast: payload });\n});\n'''
              if 'app.post("/api/admin/broadcasts"' not in s:
                  # Insert immediately before the static file middleware; fall back to before server.listen.\n                  m = re.search(r'\napp\.use\("/uploads"', s)\n                  if not m: m = re.search(r'\napp\.use\(express\.static', s)\n                  if not m: m = re.search(r'\nserver\.listen\(', s)\n                  if not m: raise RuntimeError('Could not find route insertion point')\n                  s = s[:m.start()] + route + s[m.start():]\n              return s

          def index(s):
              overlay = '''\n    <section id="globalSpotlight" class="global-spotlight hidden" aria-live="assertive" aria-atomic="true">\n      <div class="spotlight-backdrop"></div><div class="spotlight-card">\n        <div class="spotlight-orbit spotlight-orbit-a"></div><div class="spotlight-orbit spotlight-orbit-b"></div>\n        <span class="spotlight-kicker" id="spotlightKicker">NEON LIVE</span>\n        <h2 id="spotlightTitle">Live</h2><p id="spotlightMessage"></p><div class="spotlight-meta"><span id="spotlightSender"></span><span id="spotlightCountdown"></span></div>\n        <button id="spotlightClose" class="button button-secondary" type="button">Schließen</button>\n      </div>\n    </section>\n    <section id="broadcastControl" class="neon-broadcast-control hidden" aria-label="Admin Live Event">\n      <div class="broadcast-heading"><span class="kicker">ADMIN LIVE CONTROL</span><h3>⚡ Bildschirm-Event</h3><p>Deine Nachricht erscheint bei allen gerade verbundenen NEON-Nutzern groß und animiert.</p></div>\n      <form id="broadcastForm" class="broadcast-form">\n        <input id="broadcastTitle" maxlength="60" placeholder="Titel · z. B. NEON DROP" required>\n        <textarea id="broadcastMessage" maxlength="280" rows="3" placeholder="Was sollen alle sehen?" required></textarea>\n        <div class="broadcast-row"><select id="broadcastStyle"><option value="spotlight">✨ Spotlight</option><option value="celebrate">🎉 Celebrate</option><option value="alert">⚡ Alert</option></select><select id="broadcastDuration"><option value="6000">6 Sekunden</option><option value="9000" selected>9 Sekunden</option><option value="14000">14 Sekunden</option><option value="20000">20 Sekunden</option></select><button class="button button-primary" type="submit">LIVE an alle ↗</button></div>\n        <p id="broadcastError" class="form-error" role="alert"></p>\n      </form>\n    </section>\n'''
              if 'id="globalSpotlight"' not in s:
                  s = s.replace('</body>', overlay + '  </body>')
              return s

          def appjs(s):
              extra = r'''\n\n// NEON MEGA INTERACTION LAYER\nfunction showGlobalSpotlight(data) {\n  const root = $("globalSpotlight"); if (!root) return;\n  $("spotlightTitle").textContent = data.title || "NEON LIVE";\n  $("spotlightMessage").textContent = data.message || "";\n  $("spotlightSender").textContent = "@" + (data.sender || "admin");\n  $("spotlightKicker").textContent = data.style === "celebrate" ? "NEON CELEBRATE" : data.style === "alert" ? "NEON ALERT" : "NEON LIVE";\n  root.dataset.style = data.style || "spotlight";\n  root.classList.remove("hidden", "spotlight-in", "spotlight-out");\n  void root.offsetWidth; root.classList.add("spotlight-in");\n  let left = Math.ceil((Number(data.durationMs) || 9000) / 1000);\n  $("spotlightCountdown").textContent = left + "s";\n  clearInterval(window.neonSpotlightTimer); clearTimeout(window.neonSpotlightCloseTimer);\n  window.neonSpotlightTimer = setInterval(() => { left -= 1; if ($("spotlightCountdown")) $("spotlightCountdown").textContent = Math.max(0,left) + "s"; }, 1000);\n  window.neonSpotlightCloseTimer = setTimeout(closeGlobalSpotlight, Number(data.durationMs) || 9000);\n}\nfunction closeGlobalSpotlight() {\n  const root=$("globalSpotlight"); if(!root || root.classList.contains("hidden")) return;\n  clearInterval(window.neonSpotlightTimer); clearTimeout(window.neonSpotlightCloseTimer);\n  root.classList.remove("spotlight-in"); root.classList.add("spotlight-out");\n  setTimeout(()=>root.classList.add("hidden"),420);\n}\nif (typeof connectSocket === "function") {\n  const neonOriginalConnectSocket = connectSocket;\n  connectSocket = function() { neonOriginalConnectSocket(); if (state.socket) state.socket.on("global-spotlight", showGlobalSpotlight); };\n}\nif (typeof enterMessenger === "function") {\n  const neonOriginalEnterMessenger = enterMessenger;\n  enterMessenger = function() { neonOriginalEnterMessenger(); const c=$("broadcastControl"); if(c) c.classList.toggle("hidden", state.user?.role !== "admin"); };\n}\ndocument.addEventListener("click", event => { if (event.target?.id === "spotlightClose") closeGlobalSpotlight(); });\ndocument.addEventListener("submit", async event => {\n  if (event.target?.id !== "broadcastForm") return;\n  event.preventDefault(); showError("broadcastError", "");\n  const button = event.target.querySelector('button[type="submit"]'); button.disabled = true;\n  try {\n    await api("/api/admin/broadcasts", {method:"POST", body:JSON.stringify({title:$("broadcastTitle").value, message:$("broadcastMessage").value, style:$("broadcastStyle").value, durationMs:Number($("broadcastDuration").value)})});\n    $("broadcastMessage").value=""; showToast("⚡ Live-Event an alle gesendet.");\n  } catch (error) { showError("broadcastError", error.message); }\n  finally { button.disabled = false; }\n});\n'''
              return s + extra

          def css(s):
              css = r'''\n\n/* NEON MEGA UPGRADE — cinematic motion, glass, depth and live events */\n:root { --neon-glow: 0 0 42px rgba(139,124,255,.28); }\nbody { background: radial-gradient(circle at 12% 10%, rgba(139,124,255,.16), transparent 28%), radial-gradient(circle at 88% 82%, rgba(72,198,239,.10), transparent 30%), var(--bg, #09090f); }\n.messenger-shell, .auth-card, .utility-view, .chat-panel, .sidebar { animation: neon-rise .65s cubic-bezier(.2,.8,.2,1) both; }\n.rail-button, .conversation-item, .button, .color-option { transition: transform .22s ease, box-shadow .22s ease, filter .22s ease; }\n.rail-button:hover, .conversation-item:hover, .button:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: var(--neon-glow); }\n.message-bubble { animation: message-pop .28s cubic-bezier(.2,.9,.25,1.2) both; }\n.neon-broadcast-control { margin: 18px 0; padding: 20px; border: 1px solid rgba(139,124,255,.32); border-radius: 24px; background: linear-gradient(135deg, rgba(139,124,255,.13), rgba(72,198,239,.07)); box-shadow: 0 18px 70px rgba(0,0,0,.28), var(--neon-glow); backdrop-filter: blur(18px); }\n.broadcast-heading h3 { margin: 4px 0 5px; font-size: 1.25rem; }\n.broadcast-heading p { margin: 0 0 14px; opacity: .72; }\n.broadcast-form { display:grid; gap:10px; }\n.broadcast-form input, .broadcast-form textarea, .broadcast-form select { width:100%; border:1px solid rgba(255,255,255,.10); border-radius:14px; padding:12px 14px; background:rgba(255,255,255,.055); color:inherit; }\n.broadcast-row { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:center; }\n.global-spotlight { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; padding:24px; }\n.global-spotlight.hidden { display:none; }\n.spotlight-backdrop { position:absolute; inset:0; background:rgba(3,3,10,.76); backdrop-filter:blur(18px); }\n.spotlight-card { position:relative; width:min(900px,100%); min-height:360px; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:58px 52px; overflow:hidden; border:1px solid rgba(255,255,255,.18); border-radius:36px; background:linear-gradient(145deg,rgba(24,22,42,.94),rgba(12,17,29,.94)); box-shadow:0 40px 130px rgba(0,0,0,.62), 0 0 100px rgba(139,124,255,.30); }\n.spotlight-card h2 { position:relative; margin:8px 0 14px; font-size:clamp(2.4rem,7vw,6rem); line-height:.95; letter-spacing:-.06em; }\n.spotlight-card p { position:relative; margin:0 auto 22px; max-width:760px; font-size:clamp(1.15rem,2.6vw,2rem); line-height:1.25; opacity:.92; white-space:pre-wrap; }\n.spotlight-kicker, .spotlight-meta, .spotlight-card button { position:relative; z-index:2; }\n.spotlight-meta { display:flex; justify-content:center; gap:18px; opacity:.66; margin-bottom:20px; }\n.spotlight-orbit { position:absolute; width:300px; height:300px; border-radius:50%; border:1px solid rgba(139,124,255,.25); animation:orbit 9s linear infinite; }\n.spotlight-orbit-a { left:-120px; top:-120px; box-shadow:0 0 80px rgba(139,124,255,.25); }\n.spotlight-orbit-b { right:-150px; bottom:-160px; animation-direction:reverse; border-color:rgba(72,198,239,.25); }\n.global-spotlight[data-style="celebrate"] .spotlight-card { box-shadow:0 40px 130px rgba(0,0,0,.62), 0 0 120px rgba(85,214,167,.28); }\n.global-spotlight[data-style="alert"] .spotlight-card { box-shadow:0 40px 130px rgba(0,0,0,.62), 0 0 120px rgba(251,113,133,.30); }\n.spotlight-in .spotlight-card { animation:spotlight-in .5s cubic-bezier(.16,1,.3,1) both; }\n.spotlight-out .spotlight-card { animation:spotlight-out .4s ease both; }\n@keyframes neon-rise { from { opacity:0; transform:translateY(12px) scale(.985); } to { opacity:1; transform:none; } }\n@keyframes message-pop { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }\n@keyframes spotlight-in { from { opacity:0; transform:translateY(40px) scale(.88) rotateX(8deg); } to { opacity:1; transform:none; } }\n@keyframes spotlight-out { to { opacity:0; transform:translateY(24px) scale(.96); } }\n@keyframes orbit { to { transform:rotate(360deg) scale(1.08); } }\n@media (max-width:700px) { .broadcast-row { grid-template-columns:1fr; } .spotlight-card { padding:42px 22px; min-height:320px; } }\n@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important; } }\n'''
              return s + css

          changed = False
          changed |= patch('server.js', 'app.post("/api/admin/broadcasts"', server)
          changed |= patch('public/index.html', 'id="globalSpotlight"', index)
          changed |= patch('public/app.js', 'NEON MEGA INTERACTION LAYER', appjs)
          changed |= patch('public/style.css', 'NEON MEGA UPGRADE', css)
          if not changed:
              print('Nothing to commit')
              raise SystemExit(0)

      - name: Commit generated upgrade
        run: |
          git config user.name "NEON Upgrade Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/index.html public/app.js public/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Apply NEON mega upgrade"
          git push

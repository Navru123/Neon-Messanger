name: Fix NEON registration form
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix NEON registration form') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch registration form
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('public/index.html')
          s = index.read_text(encoding='utf-8')

          old_register = '<div id="registerFields" class="field hidden"><label for="registerName">ANZEIGENAME</label><input id="registerName" maxlength="24" autocomplete="nickname" placeholder="Wie sollen dich andere sehen?"></div>'
          new_register = '''<div id="registerFields" class="field hidden"><label for="registerName">ANZEIGENAME</label><input id="registerName" name="displayName" maxlength="24" autocomplete="nickname" spellcheck="false" placeholder="Wie sollen dich andere sehen?"></div><div id="registerUsernameField" class="field hidden"><label for="usernameRegister">BENUTZERNAME</label><input id="usernameRegister" name="username" maxlength="24" minlength="3" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="z. B. creator"></div>'''
          if 'id="usernameRegister"' not in s:
              if old_register not in s:
                  raise SystemExit('register field marker not found')
              s = s.replace(old_register, new_register, 1)

          old_login = '<div class="field"><label for="loginName" id="loginLabel">E-MAIL ODER BENUTZERNAME</label><input id="loginName" required maxlength="254" autocomplete="username" placeholder="du@beispiel.de"></div>'
          new_login = '<div class="field"><label for="loginName" id="loginLabel">E-MAIL ODER BENUTZERNAME</label><input id="loginName" name="email" type="text" required maxlength="254" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="du@beispiel.de"></div>'
          if old_login in s:
              s = s.replace(old_login, new_login, 1)
          index.write_text(s, encoding='utf-8')

          app = Path('public/app.js')
          s = app.read_text(encoding='utf-8')
          start = s.index('function setAuthMode(mode) {')
          end = s.index('\nasync function onAuthSubmit', start)
          replacement = '''function setAuthMode(mode) {
  const register = mode === "register";
  $("loginTab").classList.toggle("active",!register); $("registerTab").classList.toggle("active",register);
  $("registerFields").classList.toggle("hidden",!register);
  $("registerUsernameField")?.classList.toggle("hidden",!register);
  $("authKicker").textContent = register ? "DEIN NEUES KAPITEL" : "WILLKOMMEN ZURÜCK";
  $("authTitle").textContent = register ? "Schön, dich kennenzulernen." : "Schön, dass du da bist.";
  $("authSubtitle").textContent = register ? "Erstelle dein Konto und finde deine Leute." : "Melde dich an und setze deine Gespräche fort.";
  $("authSubmit").innerHTML = register ? 'Konto erstellen <span>↗</span>' : 'Anmelden <span>↗</span>';
  $("loginName").type = register ? "email" : "text";
  $("loginName").autocomplete = register ? "email" : "username";
  $("loginName").name = register ? "email" : "login";
  $("loginName").label = register ? "E-Mail-Adresse" : "E-Mail oder Benutzername";
  $("loginName").placeholder = register ? "du@beispiel.de" : "du@beispiel.de";
  $("password").autocomplete = register ? "new-password" : "current-password";
  $("password").minLength = register ? 10 : 1;
  showError("authError","");
  $("authForm").dataset.mode = mode;
}'''
          s = s[:start] + replacement + s[end:]

          start = s.index('async function onAuthSubmit(event) {')
          end = s.index('\nfunction enterMessenger()', start)
          replacement = '''async function onAuthSubmit(event) {
  event.preventDefault(); showError("authError","");
  const register = $("authForm").dataset.mode === "register";
  const login = $("loginName").value.trim();
  const password = $("password").value;
  const button = $("authSubmit"); button.disabled = true;
  try {
    const payload = register
      ? {email:login,username:$("usernameRegister").value.trim(),displayName:$("registerName").value.trim(),password}
      : {login,password};
    if (register) {
      if (!/^[A-Za-z0-9_]{3,24}$/.test(payload.username)) throw new Error("Der Benutzername darf 3–24 Zeichen lang sein und nur Buchstaben, Zahlen oder _ enthalten.");
      if (payload.displayName.length < 2) throw new Error("Dein Anzeigename muss mindestens 2 Zeichen lang sein.");
      if (!/^\\S+@\\S+\\.\\S+$/.test(payload.email)) throw new Error("Bitte gib eine gültige E-Mail-Adresse ein.");
    }
    const result = await api(register ? "/api/auth/register" : "/api/auth/login",{method:"POST",body:JSON.stringify(payload)});
    if(register && result.pendingVerification){showError("authError",result.message);if(result.developmentVerificationUrl){showError("authError",result.message+" Entwicklungslink: "+result.developmentVerificationUrl);} $("resendVerificationBtn").classList.remove("hidden");return;}
    state.user = result.user; enterMessenger(); await refreshConversations(); maybeJoinInviteRoom();
  } catch (error) { showError("authError",error.message); if(error.message.toLowerCase().includes("bestätige zuerst")) $("resendVerificationBtn").classList.remove("hidden"); }
  finally { button.disabled = false; }
}'''
          s = s[:start] + replacement + s[end:]
          app.write_text(s, encoding='utf-8')

          style = Path('public/style.css')
          s = style.read_text(encoding='utf-8')
          marker = '/* NEON AUTOFILL FIX */'
          if marker not in s:
              s += '''\n\n/* NEON AUTOFILL FIX */
.auth-card input:-webkit-autofill,
.auth-card input:-webkit-autofill:hover,
.auth-card input:-webkit-autofill:focus,
.auth-card input:autofill {
  -webkit-text-fill-color: #f7f5ff !important;
  caret-color: #f7f5ff;
  -webkit-box-shadow: 0 0 0 1000px #181722 inset !important;
  box-shadow: 0 0 0 1000px #181722 inset !important;
  border-color: rgba(139,124,255,.65) !important;
}
.auth-card input::placeholder { color: rgba(247,245,255,.38); }
'''
              style.write_text(s, encoding='utf-8')

          print('registration form patched')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'NEON Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/index.html public/app.js public/style.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix NEON registration form'
          git push

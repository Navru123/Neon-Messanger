services:
  - type: web
    name: neon-gruppenchat
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/chat.db
    disk:
      name: neon-chat-data
      mountPath: /var/data
      sizeGB: 1
